---
# PostgreSQL version - stable supported version
postgres_version: "17"
postgres_formula: "postgresql@17"

# PostgreSQL directories and paths
postgres_data_dir: "/opt/homebrew/var/postgresql@17"
postgres_log_dir: "/opt/homebrew/var/log/postgresql@17"
postgres_conf_dir: "/opt/homebrew/etc/postgresql@17"

# Service configuration
postgres_service_name: "postgresql@17"

# Database configuration
postgres_port: 5432
postgres_listen_addresses: "localhost"
postgres_max_connections: 100

# Main database and admin user
postgres_admin_1psa_item: "localhost_postgres_postgres"
postgres_admin_user: "{{ lookup('pipe', '1psa -u ' ~ postgres_admin_1psa_item) | trim }}"
postgres_admin_password: "{{ lookup('pipe', '1psa -p ' ~ postgres_admin_1psa_item) | trim }}"

# Application database
app_database: "myapp_db"
app_database_owner: "app_owner"

# Application users
postgres_users:
  - name: "app_owner"
    password: "{{ lookup('env', 'APP_OWNER_PASSWORD') | default('changeme_owner', true) }}"
    role_attr_flags: "CREATEDB,NOSUPERUSER"
    db: "{{ app_database }}"
    priv: "ALL"
    
  - name: "app_user"
    password: "{{ lookup('env', 'APP_USER_PASSWORD') | default('changeme_user', true) }}"
    role_attr_flags: "NOSUPERUSER,NOCREATEDB"
    db: "{{ app_database }}"
    priv: "CONNECT"
    
  - name: "app_readonly"
    password: "{{ lookup('env', 'APP_READONLY_PASSWORD') | default('changeme_readonly', true) }}"
    role_attr_flags: "NOSUPERUSER,NOCREATEDB"
    db: "{{ app_database }}"
    priv: "CONNECT"

# Roles
postgres_roles:
  - name: "read_only_role"
    state: present
  - name: "read_write_role"
    state: present

# Security settings
postgres_ssl: "on"
postgres_password_encryption: "scram-sha-256"  # pragma: allowlist secret

# TLS / SSL material (R300-series in 07_standup_postgres-requirements.md)
# These defaults are inert while postgres_ssl == "off"; later slices wire them
# into postgresql.conf and pg_hba.conf when ssl is enabled.
postgres_ssl_min_protocol_version: "TLSv1.3"
postgres_ssl_regenerate: false                # set true via --regenerate-cert
postgres_ssl_renew_within_days: 30            # auto-regenerate when within window
postgres_ssl_cn: "localhost"
postgres_ssl_san:
  - "DNS:localhost"
  - "IP:127.0.0.1"
  - "IP:::1"
postgres_ssl_days: 825                        # browser/Apple-friendly cert lifetime cap
postgres_ssl_key_bits: 4096

# Storage backend for TLS material: "disk" or "1psa"
postgres_ssl_backend: "disk"

# disk backend (gitignored under playbook_dir)
postgres_ssl_disk_dir: "{{ playbook_dir }}/.secrets/tls"

# 1psa backend (1Password Secure Note; reads via 1psa, writes via op CLI)
postgres_ssl_1psa_item: "localhost_postgres_tls"
postgres_ssl_1psa_vault: "odus"               # required for service-account sessions; "" for default account vault
postgres_ssl_1psa_field_cert: "cert"
postgres_ssl_1psa_field_key: "key"
postgres_ssl_1psa_field_ca: "ca"

# Backup settings
postgres_backup_dir: "/opt/homebrew/var/backups/postgres"



