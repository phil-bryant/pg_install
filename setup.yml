- name: Setup PostgreSQL on macOS
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars/postgres.yml
  tasks:
    - name: Check whether Homebrew is installed
      ansible.builtin.command:
        argv: [brew, --version]
      register: homebrew_check
      failed_when: false
      changed_when: false
    - name: Fail when Homebrew is unavailable
      ansible.builtin.fail:
        msg: Homebrew is not installed. Please install it from https://brew.sh
      when: homebrew_check.rc != 0
    - name: Validate postgres admin credentials from 1psa
      ansible.builtin.assert:
        that:
          - postgres_admin_user | trim | length > 0
          - postgres_admin_password | trim | length > 0
        fail_msg: >-
          1psa did not return postgres admin username/password. Check
          postgres_admin_1psa_item and its fields.
      changed_when: false
    - name: Check whether target PostgreSQL formula is installed
      ansible.builtin.command:
        argv: [brew, list, --formula, "{{ postgres_formula }}"]
      register: postgres_installed
      failed_when: false
      changed_when: false
    - name: Install target PostgreSQL formula
      community.general.homebrew:
        name: "{{ postgres_formula }}"
        state: present
      when: postgres_installed.rc != 0
    - name: Install Python PostgreSQL adapter
      block:
        - name: Install psycopg2-binary with pip
          ansible.builtin.pip:
            name: psycopg2-binary
            state: present
            executable: pip3
      rescue:
        - name: Warn when psycopg2 adapter installation fails
          ansible.builtin.debug:
            msg: psycopg2-binary installation failed; continuing with playbook.
    - name: Create PostgreSQL log directory
      ansible.builtin.file:
        path: "{{ postgres_log_dir }}"
        state: directory
        mode: "0750"
    - name: Create PostgreSQL backup directory
      ansible.builtin.file:
        path: "{{ postgres_backup_dir }}"
        state: directory
        mode: "0750"
    - name: Collect Homebrew service status
      ansible.builtin.command:
        argv: [brew, services, list]
      register: brew_services
      failed_when: false
      changed_when: false
    - name: Record whether target PostgreSQL service is started
      ansible.builtin.set_fact:
        postgres_service_started: >-
          {{
            (brew_services.stdout_lines | default([])
            | select("match", "^" ~ postgres_service_name ~ "\s+started\b")
            | list | length) > 0
          }}
      changed_when: false
    - name: Check whether PostgreSQL data directory version marker exists
      ansible.builtin.stat:
        path: "{{ postgres_data_dir }}/PG_VERSION"
      register: postgres_data_exists
    - name: Read PostgreSQL data directory major version
      ansible.builtin.command:
        argv: [cut, -d., -f1, "{{ postgres_data_dir }}/PG_VERSION"]
      when: postgres_data_exists.stat.exists
      register: postgres_data_major
      changed_when: false
    - name: Fail on PostgreSQL major version mismatch in data directory
      ansible.builtin.fail:
        msg: >-
          Data directory {{ postgres_data_dir }} is major
          {{ postgres_data_major.stdout | trim }} but target is {{ postgres_version }}.
          Run pg_upgrade or dump/restore before running setup.
      when:
        - postgres_data_exists.stat.exists
        - (postgres_data_major.stdout | trim) != (postgres_version | string)
    - name: Check whether PostgreSQL data directory exists
      ansible.builtin.stat:
        path: "{{ postgres_data_dir }}"
      register: postgres_data_dir_exists
    - name: Initialize PostgreSQL data directory when missing
      ansible.builtin.command:
        argv:
          - "/opt/homebrew/opt/{{ postgres_formula }}/bin/initdb"
          - -D
          - "{{ postgres_data_dir }}"
      when: not postgres_data_exists.stat.exists
      register: initdb_result
      changed_when: initdb_result.rc == 0
    - name: Set PostgreSQL data directory permissions
      ansible.builtin.file:
        path: "{{ postgres_data_dir }}"
        state: directory
        mode: "0750"
      when: postgres_data_dir_exists.stat.exists
    - name: Set permissions on PostgreSQL data files (bulk chmod 0640)
      ansible.builtin.command:
        argv: [find, "{{ postgres_data_dir }}", -type, f, -exec, chmod, "0640", "{}", +]
      when: postgres_data_dir_exists.stat.exists
      changed_when: false
    - name: Set permissions on PostgreSQL data directories (bulk chmod 0750)
      ansible.builtin.command:
        argv: [find, "{{ postgres_data_dir }}", -type, d, -exec, chmod, "0750", "{}", +]
      when: postgres_data_dir_exists.stat.exists
      changed_when: false
    - name: Provision TLS material for PostgreSQL
      ansible.builtin.import_tasks: tasks/tls_material.yml
      when: postgres_ssl == "on"
    - name: Start PostgreSQL service when stopped
      ansible.builtin.command:
        argv: [brew, services, start, "{{ postgres_service_name }}"]
      when: not postgres_service_started
      register: postgres_started
      changed_when: postgres_started.rc == 0
    - name: Wait for PostgreSQL socket to be available
      ansible.builtin.wait_for:
        port: "{{ postgres_port }}"
        delay: 2
        timeout: 30
      when: not postgres_service_started
    - name: Pause to allow PostgreSQL startup completion
      ansible.builtin.pause:
        seconds: 3
      when: not postgres_service_started
    - name: Set postgresql.conf listen_addresses
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '{{ postgres_listen_addresses }}'"
        backup: true
      notify: restart postgresql
    - name: Set postgresql.conf port
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?port\\s*="
        line: "port = {{ postgres_port }}"
      notify: restart postgresql
    - name: Set postgresql.conf max_connections
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?max_connections\\s*="
        line: "max_connections = {{ postgres_max_connections }}"
      notify: restart postgresql
    - name: Set postgresql.conf password_encryption
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?password_encryption\\s*="
        line: "password_encryption = {{ postgres_password_encryption }}"
      notify: restart postgresql
    - name: Set postgresql.conf ssl
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?ssl\\s*="
        line: "ssl = {{ postgres_ssl }}"
      notify: restart postgresql
    - name: Set postgresql.conf ssl_cert_file
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?ssl_cert_file\\s*="
        line: "ssl_cert_file = 'server.crt'"
      when: postgres_ssl == "on"
      notify: restart postgresql
    - name: Set postgresql.conf ssl_key_file
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?ssl_key_file\\s*="
        line: "ssl_key_file = 'server.key'"
      when: postgres_ssl == "on"
      notify: restart postgresql
    - name: Set postgresql.conf ssl_ca_file
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?ssl_ca_file\\s*="
        line: "ssl_ca_file = 'root.crt'"
      when: postgres_ssl == "on"
      notify: restart postgresql
    - name: Set postgresql.conf ssl_min_protocol_version
      ansible.builtin.lineinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        regexp: "^#?ssl_min_protocol_version\\s*="
        line: "ssl_min_protocol_version = '{{ postgres_ssl_min_protocol_version }}'"
      when: postgres_ssl == "on"
      notify: restart postgresql
    - name: Set postgresql.conf logging block
      ansible.builtin.blockinfile:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        marker: "# {mark} ANSIBLE MANAGED - LOGGING"
        block: |
          log_destination = 'stderr'
          logging_collector = on
          log_directory = '{{ postgres_log_dir }}'
          log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
          log_rotation_age = 1d
          log_rotation_size = 10MB
          log_line_prefix = '%m [%p] %u@%d '
          log_timezone = 'UTC'
        backup: true
      notify: restart postgresql
    - name: Set postgresql.conf file mode
      ansible.builtin.file:
        path: "{{ postgres_data_dir }}/postgresql.conf"
        mode: "0640"
    - name: Back up original pg_hba.conf
      ansible.builtin.copy:
        src: "{{ postgres_data_dir }}/pg_hba.conf"
        dest: "{{ postgres_data_dir }}/pg_hba.conf.original"
        remote_src: true
        force: false
        mode: "0640"
    - name: Configure pg_hba.conf with trust authentication
      ansible.builtin.copy:
        dest: "{{ postgres_data_dir }}/pg_hba.conf"
        content: |
          # TYPE  DATABASE        USER            ADDRESS                 METHOD
          # Temporary trust authentication for initial setup
          local   all             all                                     trust
          host    all             all             127.0.0.1/32            trust
          host    all             all             ::1/128                 trust
        backup: true
        mode: "0640"
      notify: restart postgresql
    - name: Flush handlers after initial configuration
      ansible.builtin.meta: flush_handlers
    - name: Wait for PostgreSQL after configuration restart
      ansible.builtin.wait_for:
        port: "{{ postgres_port }}"
        delay: 2
        timeout: 30
    - name: Create PostgreSQL admin user from 1psa values
      community.postgresql.postgresql_user:
        name: "{{ postgres_admin_user }}"
        password: "{{ postgres_admin_password }}"
        role_attr_flags: SUPERUSER,CREATEDB,CREATEROLE,LOGIN
        state: present
        login_user: "{{ ansible_user_id }}"
        login_db: postgres
        login_host: localhost
      environment:
        PGPORT: "{{ postgres_port }}"
      no_log: true
    - name: Create application database
      community.postgresql.postgresql_db:
        name: "{{ app_database }}"
        encoding: UTF-8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
        template: template0
        state: present
        login_user: "{{ ansible_user_id }}"
        login_host: localhost
      environment:
        PGPORT: "{{ postgres_port }}"
    - name: Create PostgreSQL roles
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
        login_user: "{{ ansible_user_id }}"
        login_db: postgres
        login_host: localhost
      loop: "{{ postgres_roles }}"
      environment:
        PGPORT: "{{ postgres_port }}"
    - name: Create PostgreSQL users
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        role_attr_flags: "{{ item.role_attr_flags }}"
        state: present
        login_user: "{{ ansible_user_id }}"
        login_db: postgres
        login_host: localhost
      loop: "{{ postgres_users }}"
      environment:
        PGPORT: "{{ postgres_port }}"
      no_log: true
    - name: Grant database privileges to configured users
      community.postgresql.postgresql_privs:
        login_db: "{{ item.db }}"
        roles: "{{ item.name }}"
        type: database
        privs: "{{ item.priv }}"
        login_user: "{{ ansible_user_id }}"
        login_host: localhost
      loop: "{{ postgres_users }}"
      environment:
        PGPORT: "{{ postgres_port }}"
      when: item.priv is defined
    - name: Check whether SQL initialization files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: sql_files_check
      loop:
        - sql/init_db.sql
        - sql/users_roles.sql
        - sql/sample_data.sql
    - name: Execute database initialization SQL file
      ansible.builtin.command:
        argv:
          - "/opt/homebrew/opt/{{ postgres_formula }}/bin/psql"
          - -h
          - localhost
          - -p
          - "{{ postgres_port }}"
          - -U
          - "{{ postgres_users[0].name }}"
          - -d
          - "{{ app_database }}"
          - -f
          - sql/init_db.sql
      environment:
        PGPASSWORD: "{{ postgres_users[0].password }}"
      when: sql_files_check.results[0].stat.exists
      register: init_db_sql_result
      changed_when: init_db_sql_result.rc == 0
    - name: Execute users and roles SQL file
      ansible.builtin.command:
        argv:
          - "/opt/homebrew/opt/{{ postgres_formula }}/bin/psql"
          - -h
          - localhost
          - -p
          - "{{ postgres_port }}"
          - -U
          - "{{ postgres_users[0].name }}"
          - -d
          - "{{ app_database }}"
          - -f
          - sql/users_roles.sql
      environment:
        PGPASSWORD: "{{ postgres_users[0].password }}"
      when: sql_files_check.results[1].stat.exists
      register: users_roles_sql_result
      changed_when: users_roles_sql_result.rc == 0
    - name: Execute sample data SQL file
      ansible.builtin.command:
        argv:
          - "/opt/homebrew/opt/{{ postgres_formula }}/bin/psql"
          - -h
          - localhost
          - -p
          - "{{ postgres_port }}"
          - -U
          - "{{ postgres_users[0].name }}"
          - -d
          - "{{ app_database }}"
          - -f
          - sql/sample_data.sql
      environment:
        PGPASSWORD: "{{ postgres_users[0].password }}"
      when: sql_files_check.results[2].stat.exists
      register: sample_data_sql_result
      changed_when: sample_data_sql_result.rc == 0
    - name: Configure pg_hba.conf with secure authentication
      ansible.builtin.copy:
        dest: "{{ postgres_data_dir }}/pg_hba.conf"
        content: |
          # TYPE  DATABASE        USER            ADDRESS                 METHOD
          {% if postgres_ssl == "on" %}
          # ssl=on: require TLS for host connections, reject non-TLS host connections.
          local     all all                                  scram-sha-256
          hostssl   all all 127.0.0.1/32                     scram-sha-256
          hostssl   all all ::1/128                           scram-sha-256
          hostnossl all all all                              reject
          host      all all 0.0.0.0/0                        reject
          {% else %}
          local   all             all                                     scram-sha-256
          host    all             all             127.0.0.1/32            scram-sha-256
          host    all             all             ::1/128                 scram-sha-256
          host    all             all             0.0.0.0/0               reject
          {% endif %}
        backup: true
        mode: "0640"
      notify: restart postgresql
    - name: Flush handlers after secure authentication update
      ansible.builtin.meta: flush_handlers
    - name: Wait for PostgreSQL after final restart
      ansible.builtin.wait_for:
        port: "{{ postgres_port }}"
        delay: 2
        timeout: 30
    - name: Collect final Homebrew service status
      ansible.builtin.command:
        argv: [brew, services, list]
      register: final_status
      changed_when: false
    - name: Display PostgreSQL service status lines
      ansible.builtin.debug:
        msg: >-
          {{
            final_status.stdout_lines | default([])
            | select("search", "^" ~ postgres_service_name ~ "\s+")
            | list
          }}
    - name: Query PostgreSQL version string
      ansible.builtin.command:
        argv:
          - "/opt/homebrew/opt/{{ postgres_formula }}/bin/psql"
          - -h
          - localhost
          - -p
          - "{{ postgres_port }}"
          - -U
          - "{{ postgres_users[0].name }}"
          - -d
          - postgres
          - -t
          - -A
          - -c
          - SELECT version();
      environment:
        PGPASSWORD: "{{ postgres_users[0].password }}"
      register: pg_version
      changed_when: false
    - name: Display setup completion message
      ansible.builtin.debug:
        msg:
          - ==========================================
          - PostgreSQL Setup Complete!
          - ==========================================
          - "Version: {{ pg_version.stdout | trim }}"
          - "Database: {{ app_database }}"
          - "Port: {{ postgres_port }}"
          - "Users created: {{ postgres_users | map(attribute='name') | list | join(', ') }}"
          - ""
          - >-
            Connect with: /opt/homebrew/opt/{{ postgres_formula }}/bin/psql -h localhost
            -p {{ postgres_port }} -U app_owner -d {{ app_database }}
          - (Set PGPASSWORD or enter the password when prompted)
          - ==========================================
  handlers:
    - name: Restart PostgreSQL service
      ansible.builtin.command:
        argv: [brew, services, restart, "{{ postgres_service_name }}"]
      register: postgres_restarted
      changed_when: postgres_restarted.rc == 0
      listen: restart postgresql
