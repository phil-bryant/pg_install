---
- name: Teardown PostgreSQL on macOS
  hosts: localhost
  gather_facts: yes
  vars_files:
    - vars/postgres.yml
  
  vars_prompt:
    - name: confirm_teardown
      prompt: "This will COMPLETELY REMOVE PostgreSQL and ALL DATA. Type 'yes' to confirm"
      private: no
      
  tasks:
    - name: Verify confirmation
      fail:
        msg: "Teardown cancelled. You must type 'yes' to confirm."
      when: confirm_teardown != 'yes'
      
    - name: Display warning
      debug:
        msg:
          - "=========================================="
          - "WARNING: Beginning PostgreSQL Teardown"
          - "=========================================="
          - "This will remove:"
          - "  - PostgreSQL service"
          - "  - All databases and data"
          - "  - PostgreSQL installation"
          - "  - Configuration files"
          - "  - Log files"
          - "=========================================="
    
    # ==========================================
    # BACKUP BEFORE DESTRUCTION (Optional)
    # ==========================================
    
    - name: Check if PostgreSQL is installed for backup
      stat:
        path: "/opt/homebrew/opt/{{ postgres_formula }}/bin/pg_dump"
      register: pg_dump_exists
    
    - name: Check if PostgreSQL service is running for backup
      shell: brew services list | grep "{{ postgres_service_name }}" | grep -q "started"
      register: postgres_running_for_backup
      failed_when: false
      changed_when: false
      when: pg_dump_exists.stat.exists
    
    - name: Create final backup of all databases
      block:
        - name: Create backup timestamp directory
          file:
            path: "{{ postgres_backup_dir }}/final_backup_{{ ansible_date_time.epoch }}"
            state: directory
            mode: '0770'
          register: backup_dir
          
        - name: Backup application database
          shell: |
            /opt/homebrew/opt/{{ postgres_formula }}/bin/pg_dump -h localhost -p {{ postgres_port }} {{ app_database }} > {{ backup_dir.path }}/{{ app_database }}_final.sql
          environment:
            PGUSER: "{{ postgres_users[0].name }}"
            PGPASSWORD: "{{ postgres_users[0].password }}"
          
        - name: Display backup location
          debug:
            msg: "Final backup saved to: {{ backup_dir.path }}"
      when: 
        - pg_dump_exists.stat.exists
        - postgres_running_for_backup.rc == 0
    
    # ==========================================
    # STOP SERVICE
    # ==========================================
    
    - name: Check if PostgreSQL service is running
      shell: brew services list | grep "{{ postgres_service_name }}" | grep -q "started"
      register: postgres_running
      failed_when: false
      changed_when: false

    - name: Discover all Homebrew PostgreSQL services
      shell: brew services list | awk '/^postgresql(@[0-9]+)? / {print $1}'
      register: postgres_services
      changed_when: false
      
    - name: Stop PostgreSQL service
      shell: brew services stop {{ postgres_service_name }}
      when: postgres_running.rc == 0
      register: postgres_stopped

    - name: Stop all discovered PostgreSQL services
      shell: brew services stop {{ item }}
      loop: "{{ postgres_services.stdout_lines | default([]) }}"
      when: postgres_services.stdout_lines | length > 0
      register: postgres_all_stopped
      ignore_errors: yes
      
    - name: Wait for PostgreSQL to stop
      wait_for:
        port: "{{ postgres_port }}"
        state: stopped
        timeout: 30
      when: postgres_stopped.changed | default(false)
      ignore_errors: yes
      
    - name: Check for remaining PostgreSQL processes
      shell: ps aux | rg '/opt/homebrew/opt/postgresql@.*/bin/postgres|postgres: '
      register: postgres_pids
      failed_when: false
      changed_when: false
      
    - name: Force kill any remaining PostgreSQL processes
      shell: pkill -9 -f "postgres"
      when: postgres_pids.stdout != ""
      ignore_errors: yes
      
    - name: Verify PostgreSQL processes are terminated
      shell: ps aux | rg '/opt/homebrew/opt/postgresql@.*/bin/postgres|postgres: '
      register: postgres_pids_after
      changed_when: false
      ignore_errors: yes
      failed_when: postgres_pids_after.rc == 0 and postgres_pids_after.stdout != ""
    
    # ==========================================
    # REMOVE DATA AND CONFIGURATION
    # ==========================================
    
    - name: Remove PostgreSQL data directory
      file:
        path: "{{ postgres_data_dir }}"
        state: absent
      ignore_errors: yes
      
    - name: Remove PostgreSQL configuration directory
      file:
        path: "{{ postgres_conf_dir }}"
        state: absent
      ignore_errors: yes
      
    - name: Remove PostgreSQL log directory
      file:
        path: "{{ postgres_log_dir }}"
        state: absent
      ignore_errors: yes
      
    - name: List backup directory size
      shell: |
        if [ -d "{{ postgres_backup_dir }}" ]; then
          du -sh {{ postgres_backup_dir }}
        else
          echo "No backups found"
        fi
      register: backup_size
      changed_when: false
      ignore_errors: yes
      
    - name: Display backup information
      debug:
        msg: "Backup directory: {{ backup_size.stdout }}"
      when: backup_size.stdout is defined
      
    - name: Remove backup directory (optional - commented out for safety)
      debug:
        msg: "Backups preserved at: {{ postgres_backup_dir }}. Remove manually if desired."
    
    # Uncomment to remove backups:
    # - name: Remove PostgreSQL backup directory
    #   file:
    #     path: "{{ postgres_backup_dir }}"
    #     state: absent
    
    # ==========================================
    # UNINSTALL POSTGRESQL
    # ==========================================
    
    - name: Check if PostgreSQL {{ postgres_version }} is installed
      shell: brew list --formula | grep -q "^{{ postgres_formula }}$"
      register: postgres_installed
      failed_when: false
      changed_when: false

    - name: Discover installed PostgreSQL formulas
      shell: brew list --formula | rg '^postgresql(@[0-9]+)?$'
      register: postgres_formulas
      failed_when: false
      changed_when: false
      
    - name: Uninstall PostgreSQL {{ postgres_version }}
      homebrew:
        name: "{{ postgres_formula }}"
        state: absent
      when: postgres_installed.rc == 0

    - name: Uninstall all discovered PostgreSQL formulas
      homebrew:
        name: "{{ item }}"
        state: absent
      loop: "{{ postgres_formulas.stdout_lines | default([]) }}"
      when: postgres_formulas.rc == 0 and postgres_formulas.stdout_lines | length > 0
      ignore_errors: yes
      
    - name: Remove any remaining PostgreSQL files in Homebrew directories
      shell: |
        timestamp=$(date +%Y-%m-%d-%H.%M.%S)
        trash_dir="$HOME/.Trash/postgres_cleanup_$timestamp"
        mkdir -p "$trash_dir"
        for path in \
          /opt/homebrew/var/postgresql@* \
          /opt/homebrew/etc/postgresql@* \
          /opt/homebrew/var/log/postgresql@* \
          /usr/local/var/postgresql@* \
          /usr/local/etc/postgresql@* \
          /usr/local/var/log/postgresql@* \
          /usr/local/var/postgres@* \
          /usr/local/etc/postgres@* \
          /usr/local/var/log/postgres@*; do
          if [ -e "$path" ]; then
            mv "$path" "$trash_dir/" || true
          fi
        done
      ignore_errors: yes
      
    - name: Clean up Homebrew
      shell: brew cleanup
      ignore_errors: yes
    
    # ==========================================
    # VERIFICATION
    # ==========================================
    
    - name: Verify PostgreSQL is removed
      shell: brew list --formula | grep "^{{ postgres_formula }}$"
      register: verify_removal
      failed_when: false
      changed_when: false
      
    - name: Check if port is free
      wait_for:
        port: "{{ postgres_port }}"
        state: stopped
        timeout: 5
      ignore_errors: yes
      
    - name: Display teardown completion message
      debug:
        msg:
          - "=========================================="
          - "PostgreSQL Teardown Complete!"
          - "=========================================="
          - "PostgreSQL {{ postgres_version }} has been removed"
          - "Service: Stopped and removed"
          - "Data: Removed"
          - "Config: Removed"
          - "Logs: Removed"
          - "Backups: Preserved at {{ postgres_backup_dir }}"
          - ""
          - "Status: {{ 'Successfully removed' if verify_removal.rc != 0 else 'WARNING: PostgreSQL may still be installed' }}"
          - "=========================================="



